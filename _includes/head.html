<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f3e8">
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Sacramento&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
{% seo %}
{% assign social_description = page.description | default: site.description %}
<meta name="twitter:description" content="{{ social_description | strip_html | normalize_whitespace | escape }}">
<script>
  (() => {
    try {
      const savedTheme = localStorage.getItem("mwen-theme");
      const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = savedTheme || (systemPrefersDark ? "dark" : "light");
    } catch (_) {
      document.documentElement.dataset.theme = "light";
    }
  })();
</script>
